<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRPMAN | Turbo Lightning</title>
    <script src="https://cdn.jsdelivr.net/npm/xrpl@4.0.0/build/xrpl-latest-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --c-neon: #00ff00; --c-darker: #001a00; --glow: 0 0 20px rgba(0, 255, 0, 0.6); }
        body { background-color: #000; color: #fff; font-family: 'Courier New', monospace; overflow-x: hidden; margin: 0; }
        #fx-canvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0.8; }
        .scanline { position: fixed; inset: 0; background: linear-gradient(to bottom, transparent 50%, rgba(0, 255, 0, 0.05) 50%); background-size: 100% 4px; z-index: 50; pointer-events: none; }
        .brand-text { color: var(--c-neon); text-shadow: 0 0 15px var(--c-neon); font-weight: 900; letter-spacing: -0.02em; }
        .label-accent { color: var(--c-neon); font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.25em; margin-bottom: 6px; display: block; }
        .glass { background: rgba(0, 5, 0, 0.85); border: 1px solid rgba(0, 255, 0, 0.2); box-shadow: var(--glow); backdrop-filter: blur(4px); }
        .secret-blur { filter: blur(14px); transition: filter 0.2s; cursor: pointer; }
        .secret-visible { filter: none !important; }
        .input-dark { background: #000; border: 1px solid #00ff0044; color: var(--c-neon); outline: none; padding: 12px; font-size: 0.8rem; }
        .btn-primary { background: var(--c-neon); color: #000; font-weight: 900; text-transform: uppercase; border: none; cursor: pointer; box-shadow: 0 0 15px var(--c-neon); }
        .btn-primary:hover { filter: brightness(1.2); transform: scale(1.02); }
        .tab-btn { padding: 14px 28px; font-weight: 900; font-size: 10px; text-transform: uppercase; color: #333; border-bottom: 2px solid transparent; cursor: pointer; }
        .tab-btn.active { color: var(--c-neon); border-bottom-color: var(--c-neon); text-shadow: 0 0 10px var(--c-neon); }
        #status-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: none; align-items: center; justify-content: center; flex-direction: column; border: 4px solid var(--c-neon); margin: 20px; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center">
    <canvas id="fx-canvas"></canvas>
    <div class="scanline"></div>
    
    <div id="status-overlay">
        <div id="overlay-msg" class="text-[#00ff00] text-2xl font-black mb-4 uppercase tracking-[0.5em] italic">POWER_SURGE_ACTIVE</div>
    </div>

    <div class="w-full max-w-6xl space-y-8 pb-32 relative z-10">
        <header class="flex flex-col items-center text-center">
            <p class="text-[10px] tracking-[1em] font-black text-[#00ff00] uppercase mb-2">High Voltage Extraction</p>
            <h1 class="text-6xl md:text-8xl font-black brand-text italic uppercase leading-none">XRPMAN</h1>
            <nav class="flex gap-4 w-full justify-center mt-8">
                <button onclick="switchTab('vault')" id="tab-vault" class="tab-btn active">Terminal</button>
                <button onclick="switchTab('vanity')" id="tab-vanity" class="tab-btn">Turbo Engine</button>
            </nav>
        </header>

        <!-- TERMINAL -->
        <div id="view-vault" class="space-y-6">
            <div class="glass p-8 rounded-sm flex flex-col md:flex-row gap-6 border-t-4 border-[#00ff00]">
                <button onclick="generateEverything()" class="btn-primary flex-1 py-6 text-sm italic">Generate Master Key</button>
                <div class="flex gap-3">
                    <button onclick="document.getElementById('vault-loader').click()" class="bg-black border border-[#00ff0044] px-10 py-6 text-[10px] font-black uppercase text-white hover:border-[#00ff00]">Import</button>
                    <button onclick="toggleVisibility()" id="vis-btn" class="bg-black border border-[#00ff0022] px-10 py-6 text-[10px] font-black uppercase text-zinc-600">Decrypt</button>
                </div>
                <input type="file" id="vault-loader" class="hidden" accept=".json" onchange="importVault(this)">
            </div>
            
            <div id="output-area" class="hidden space-y-6">
                <section class="glass p-10 border-l-8 border-[#00ff00]">
                    <label class="label-accent">r-Address (Public)</label>
                    <div id="addr" class="text-3xl md:text-5xl font-black text-white break-all tracking-tighter"></div>
                </section>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="mnemonic-grid"></div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <section class="glass p-10"><label class="label-accent">Family Seed</label><div id="seed" class="secret-blur text-2xl md:text-3xl font-black text-white break-all"></div></section>
                    <section class="glass p-10"><label class="label-accent">Xaman Secrets</label><div id="secret-nums-grid" class="secret-blur grid grid-cols-2 gap-3"></div></section>
                </div>
            </div>
        </div>

        <!-- TURBO ENGINE -->
        <div id="view-vanity" class="hidden space-y-6">
            <div class="glass p-8 border-l-8 border-[#00ff00] flex flex-col lg:flex-row gap-10">
                <div class="w-full lg:w-1/3 space-y-8">
                    <h2 class="text-xl font-black text-[#00ff00] uppercase italic tracking-[0.3em]">Extraction</h2>
                    <div>
                        <label class="label-accent">Prefix Requirement</label>
                        <div class="flex w-full shadow-[0_0_15px_rgba(0,255,0,0.2)]">
                            <span class="bg-[#00ff00] px-5 py-4 text-black font-black border-none flex items-center">r</span>
                            <input type="text" id="vanity-prefix" placeholder="WIN" class="input-dark flex-1 uppercase font-black text-xl border-none" maxlength="6">
                        </div>
                    </div>
                    <button id="vanity-trigger" onclick="toggleTurboVanity()" class="btn-primary w-full py-6 text-sm italic">Engage Turbines</button>
                </div>
                <div class="w-full lg:w-2/3 space-y-6">
                    <label class="label-accent">Worker Array Output</label>
                    <div id="node-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-3"></div>
                    <div class="mt-8 p-6 bg-black/60 border border-[#00ff0033] flex flex-col sm:flex-row justify-between items-center gap-6">
                        <span class="text-xs font-black uppercase tracking-[0.4em] text-zinc-400">Harvest: <span id="session-count" class="text-[#00ff00] text-lg">0</span></span>
                        <div id="total-attempts" class="text-[11px] text

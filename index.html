<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRPman Wallet Creator</title>
    <script src="https://cdn.jsdelivr.net/npm/xrpl@4.0.0/build/xrpl-latest-min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/argon2-browser@1.18.0/dist/argon2-bundled.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #e5e5e5; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; overflow-x: hidden; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.4; pointer-events: none; }
        .brand-text { color: #00ff00; text-shadow: 0 0 15px rgba(0, 255, 0, 0.5); }
        .glass { background: rgba(5, 5, 5, 0.85); border: 1px solid rgba(0, 255, 0, 0.1); backdrop-filter: blur(12px); }
        .secret-blur { filter: blur(14px); transition: filter 0.3s ease; cursor: pointer; user-select: none; }
        .secret-visible { filter: none !important; user-select: text; }
        .input-dark { background: rgba(0,0,0,0.6); border: 1px solid #333; color: #00ff00; outline: none; transition: all 0.2s; }
        .input-dark:focus { border-color: #00ff00; box-shadow: 0 0 10px rgba(0,255,0,0.2); }
        .btn-primary { background: #00ff00; color: #000; font-weight: 900; transition: all 0.2s; text-transform: uppercase; border: none; }
        .btn-primary:hover { background: #00cc00; box-shadow: 0 0 25px rgba(0, 255, 0, 0.4); transform: translateY(-1px); }
        .label-accent { color: #00ff00; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 8px; display: block; opacity: 0.8;}
        .section-card { border-left: 2px solid #1a1a1a; transition: border-color 0.4s; }
        .section-card:hover { border-left-color: #00ff00; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #00ff00; }
        .pro-title { font-size: 2.25rem; line-height: 1; letter-spacing: -0.05em; font-weight: 900; }
        @media (max-width: 768px) { .pro-title { font-size: 1.75rem; } }
    </style>
</head>
<body class="p-4 md:p-12 min-h-screen">
    <canvas id="bg-canvas"></canvas>

    <div class="max-w-4xl mx-auto space-y-10 pb-32 relative z-10">
        <header class="flex flex-col md:flex-row justify-between items-center md:items-end border-b border-zinc-900/50 pb-8 gap-6 text-center md:text-left">
            <div>
                <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-[0.4em] mb-1">XRPman Presents</p>
                <h1 class="pro-title brand-text italic tracking-tighter uppercase">Wallet Creator</h1>
                <p class="text-[#00ff00]/60 text-[9px] tracking-[0.6em] uppercase mt-2 font-black">Powered by Xmeme Engine</p>
            </div>
            <div class="flex gap-4">
                <button onclick="document.getElementById('vault-loader').click()" class="text-[10px] font-bold uppercase text-zinc-500 hover:text-[#00ff00] transition border border-zinc-800 px-4 py-2 rounded-lg bg-black/40">Load Vault</button>
                <input type="file" id="vault-loader" class="hidden" onchange="loadVault(this)">
            </div>
        </header>

        <!-- MASTER CONTROL -->
        <div class="glass p-6 rounded-2xl sticky top-6 z-50 flex flex-col md:flex-row gap-4 shadow-2xl">
            <button onclick="generateEverything()" class="btn-primary flex-1 py-5 rounded-xl text-xs tracking-widest font-black">Generate Master Suite</button>
            <button onclick="toggleVisibility()" id="vis-btn" class="bg-black/80 border border-zinc-800 px-8 py-5 rounded-xl text-[10px] font-bold uppercase hover:bg-zinc-900 text-zinc-400 hover:text-white transition-all">Show Secrets</button>
        </div>

        <div id="output-area" class="hidden space-y-8 animate-in fade-in duration-500">
            
            <!-- IDENTITY -->
            <section class="glass p-8 md:p-10 rounded-3xl section-card">
                <label class="label-accent">Classic Address</label>
                <div id="addr" class="text-xl md:text-3xl font-black text-white break-all select-all tracking-tighter"></div>
            </section>

            <!-- MNEMONICS -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="glass p-6 rounded-2xl section-card">
                    <label class="label-accent">12-Word BIP39</label>
                    <div id="m12" class="secret-blur text-xs text-zinc-400 leading-relaxed min-h-[50px]"></div>
                </div>
                <div class="glass p-6 rounded-2xl section-card">
                    <label class="label-accent">16-Word Ref</label>
                    <div id="m16" class="secret-blur text-xs text-zinc-400 leading-relaxed min-h-[50px]"></div>
                </div>
                <div class="glass p-6 rounded-2xl section-card">
                    <label class="label-accent">24-Word BIP39</label>
                    <div id="m24" class="secret-blur text-xs text-zinc-400 leading-relaxed min-h-[50px]"></div>
                </div>
            </div>

            <!-- XAMAN NUMBERS -->
            <section class="glass p-8 md:p-10 rounded-3xl section-card">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-sm font-black brand-text italic uppercase tracking-widest">Xaman Secret Numbers</h2>
                    <span class="text-[8px] text-zinc-600 font-bold uppercase tracking-[0.2em]">Standard A-H</span>
                </div>
                <div id="xaman-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3 secret-blur"></div>
            </section>

            <!-- FAMILY SEED -->
            <section class="glass p-8 md:p-10 rounded-3xl section-card">
                <label class="label-accent">Family Seed (s...)</label>
                <div id="seed" class="secret-blur text-2xl md:text-3xl font-black text-white break-all tracking-tight"></div>
            </section>

            <!-- HEX KEYS -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="glass p-6 rounded-2xl section-card">
                    <label class="label-accent">Private Key (Hex)</label>
                    <div id="priv" class="secret-blur text-[10px] font-bold text-zinc-600 break-all"></div>
                </div>
                <div class="glass p-6 rounded-2xl section-card">
                    <label class="label-accent">Public Key (Hex)</label>
                    <div id="pub" class="text-[10px] font-bold text-zinc-600 break-all"></div>
                </div>
            </div>

            <!-- EXPORT ENGINE -->
            <div class="glass p-8 md:p-10 rounded-[2.5rem] border-t-2 border-[#00ff00] space-y-8 bg-black/60">
                <div class="flex flex-col md:flex-row justify-between gap-6">
                    <div class="space-y-1">
                        <h3 class="text-lg font-black text-white italic uppercase tracking-tighter">Secure Vault Export</h3>
                        <p class="text-[8px] text-zinc-600 uppercase font-bold tracking-[0.3em]">AES-256 + Argon2id Security Layer</p>
                    </div>
                    <div class="flex gap-2">
                        <input type="password" id="pass-1" placeholder="Primary Pwd" class="input-dark p-3 rounded-lg text-[10px] w-full md:w-32">
                        <input type="password" id="pass-2" placeholder="Secondary Pwd" class="input-dark p-3 rounded-lg text-[10px] w-full md:w-32">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button onclick="exportEncrypted()" class="btn-primary py-4 rounded-xl text-[10px] tracking-widest font-black">Export Secure .JBE</button>
                    <button onclick="exportPlaintext()" class="bg-black text-zinc-500 border border-zinc-800 py-4 rounded-xl text-[10px] tracking-widest font-black uppercase hover:text-white transition">Download Standard JSON</button>
                </div>
                <div id="status" class="text-center text-[9px] font-bold uppercase text-zinc-700 tracking-[0.4em]">Ready for secure isolation</div>
            </div>
        </div>
    </div>

    <script>
        // --- BACKGROUND ANIMATION ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const xrpIcon = "✕"; // Symbolic representation or we can draw the path

        function initBg() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for(let i=0; i<60; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 20 + 5,
                    speed: Math.random() * 1 + 0.2,
                    opacity: Math.random() * 0.5,
                    type: Math.random() > 0.8 ? 'xrp' : 'dot'
                });
            }
        }

        function drawBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.fillStyle = `rgba(0, 255, 0, ${p.opacity})`;
                if(p.type === 'xrp') {
                    ctx.font = `${p.size}px Arial`;
                    ctx.fillText('✕', p.x, p.y);
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size/10, 0, Math.PI*2);
                    ctx.fill();
                }
                p.y += p.speed;
                if(p.y > canvas.height) p.y = -20;
            });
            requestAnimationFrame(drawBg);
        }
        window.addEventListener('resize', initBg);
        initBg();
        drawBg();

        // --- WALLET LOGIC ---
        let currentSuite = null;
        let isVisible = false;

        async function generateEverything() {
            try {
                const entropy = crypto.getRandomValues(new Uint8Array(32));
                const mnemonic24 = ethers.utils.entropyToMnemonic(entropy);
                const wallet = xrpl.Wallet.fromMnemonic(mnemonic24, { algorithm: "ecdsa-secp256k1" });
                
                const entropy16 = entropy.slice(0, 16);
                const entropyHex = Array.from(entropy16).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
                const legacyWallet = xrpl.Wallet.fromEntropy(entropyHex);

                currentSuite = {
                    address: wallet.classicAddress,
                    m24: mnemonic24,
                    m12: ethers.utils.entropyToMnemonic(entropy.slice(0, 16)),
                    m16: derive16Word(entropy),
                    seed: legacyWallet.seed,
                    priv: wallet.privateKey,
                    pub: wallet.publicKey,
                    xaman: deriveXaman(entropy)
                };

                render();
                document.getElementById('output-area').classList.remove('hidden');
                isVisible = false;
                toggleVisibility(); 
            } catch (e) {
                console.error(e);
                alert("Generation Error: " + e.message);
            }
        }

        function derive16Word(entropy) {
            const m18 = ethers.utils.entropyToMnemonic(entropy.slice(0, 24));
            return m18.split(' ').slice(0, 16).join(' ');
        }

        function deriveXaman(entropy) {
            const rows = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
            let res = {};
            const view = new DataView(entropy.buffer);
            for(let i=0; i<8; i++) {
                const val = view.getUint32(i * 4, false) % 1000000;
                res[rows[i]] = val.toString().padStart(6, '0');
            }
            return res;
        }

        function render() {
            document.getElementById('addr').innerText = currentSuite.address;
            document.getElementById('m12').innerText = currentSuite.m12;
            document.getElementById('m16').innerText = currentSuite.m16;
            document.getElementById('m24').innerText = currentSuite.m24;
            document.getElementById('seed').innerText = currentSuite.seed;
            document.getElementById('priv').innerText = currentSuite.priv;
            document.getElementById('pub').innerText = currentSuite.pub;

            const grid = document.getElementById('xaman-grid');
            grid.innerHTML = '';
            Object.entries(currentSuite.xaman).forEach(([row, val]) => {
                const div = document.createElement('div');
                div.className = "p-3 bg-black/80 rounded-xl border border-zinc-900 text-center";
                div.innerHTML = `<span class="block text-[8px] text-zinc-600 font-bold mb-1">${row}</span><span class="text-white font-black tracking-widest text-sm">${val}</span>`;
                grid.appendChild(div);
            });
        }

        function toggleVisibility() {
            isVisible = !isVisible;
            const targets = document.querySelectorAll('.secret-blur, .secret-visible');
            targets.forEach(el => {
                if (isVisible) {
                    el.classList.remove('secret-blur');
                    el.classList.add('secret-visible');
                } else {
                    el.classList.remove('secret-visible');
                    el.classList.add('secret-blur');
                }
            });
            document.getElementById('vis-btn').innerText = isVisible ? "Hide Secrets" : "Show Secrets";
        }

        async function exportEncrypted() {
            const p1 = document.getElementById('pass-1').value;
            const p2 = document.getElementById('pass-2').value;
            if (!p1 || !p2) return alert("Double passwords required.");
            
            const status = document.getElementById('status');
            status.innerText = "Encrypting Vault...";

            try {
                const salt = CryptoJS.lib.WordArray.random(16).toString();
                const keyHash = await argon2.hash({
                    pass: `${p1}:${p2}`,
                    salt: salt,
                    time: 3, mem: 65536, hashLen: 32, type: argon2.ArgonType.Argon2id
                });

                const ciphertext = CryptoJS.AES.encrypt(JSON.stringify(currentSuite), keyHash.hashHex).toString();
                const finalBlob = { version: "1.0", salt, data: ciphertext };
                
                download(JSON.stringify(finalBlob), `Vault_${currentSuite.address.slice(0,8)}.jbe`);
                status.innerText = "Secure Vault Exported";
            } catch (e) {
                status.innerText = "Encryption Failed";
            }
        }

        function exportPlaintext() {
            if (!currentSuite) return;
            download(JSON.stringify(currentSuite, null, 2), `XRPL_Plaintext_${currentSuite.address.slice(0,8)}.json`);
        }

        function download(content, filename) {
            const blob = new Blob([content], { type: "application/json" });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
        }

        async function loadVault(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const raw = JSON.parse(e.target.result);
                    if (raw.address && raw.seed) {
                        currentSuite = raw;
                    } else if (raw.data && raw.salt) {
                        const p1 = prompt("Primary Password:");
                        const p2 = prompt("Secondary Password:");
                        const keyHash = await argon2.hash({
                            pass: `${p1}:${p2}`,
                            salt: raw.salt,
                            time: 3, mem: 65536, hashLen: 32, type: argon2.ArgonType.Argon2id
                        });
                        const bytes = CryptoJS.AES.decrypt(raw.data, keyHash.hashHex);
                        currentSuite = JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
                    }
                    render();
                    document.getElementById('output-area').classList.remove('hidden');
                    isVisible = true; toggleVisibility();
                } catch (err) {
                    alert("Failed to unlock vault.");
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
